name: PR12 one-time translation status materialization
# Final materialization: compare using canonical proposal IDs, not source filenames.
on:
  push:
    branches:
      - feat/pr12-equipment-fr-review
    paths:
      - .github/workflows/pr12-materialize.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pr12-equipment-fr-review
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize source-backed statuses and commit
        run: node scripts/localization/pr12-materialize.mjs
