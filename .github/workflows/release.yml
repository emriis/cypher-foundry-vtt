name: Release Foundry System

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Verify tag matches manifest version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw system.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($version -ne $tag) {
            throw "Tag '$tag' does not match system.json version '$version'."
          }

      - name: Build compendium packs
        run: npm run build:packs

      - name: Validate compiled packs
        run: npm run test:build

      - name: Build release artifacts
        run: npm run package

      - name: Verify the published archive
        run: node scripts/verify-package.mjs

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/system.json
            dist/system.zip