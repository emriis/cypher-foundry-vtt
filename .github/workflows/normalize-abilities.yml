name: Normalize standalone ability sources

on:
  push:
    branches:
      - feature/standalone-ability-compendiums

permissions:
  contents: write

jobs:
  normalize:
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: normalize standalone ability sources')
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/standalone-ability-compendiums
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize ability sources
        run: npm run migrate:abilities

      - name: Build compendium packs
        run: npm run build:packs

      - name: Run tests
        run: npm test

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs system.json docs/ability-name-variants.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: normalize standalone ability sources"
          git push origin HEAD:feature/standalone-ability-compendiums
