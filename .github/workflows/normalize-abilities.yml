name: Normalize standalone ability sources

on:
  push:
    branches:
      - feature/standalone-ability-compendiums

permissions:
  contents: write

jobs:
  normalize:
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: normalize standalone ability sources') &&
      !startsWith(github.event.head_commit.message, 'chore: ability migration diagnostics') &&
      !startsWith(github.event.head_commit.message, 'chore: ability migration test diagnostics')
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/standalone-ability-compendiums
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Normalize ability sources
        id: migrate
        continue-on-error: true
        run: |
          npm run migrate:abilities 2>&1 | tee /tmp/ability-migration.log
          exit ${PIPESTATUS[0]}

      - name: Save migration diagnostics
        if: steps.migrate.outcome == 'failure'
        run: |
          cp /tmp/ability-migration.log docs/ability-migration-error.log

      - name: Commit migration diagnostics
        if: steps.migrate.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ability-migration-error.log
          git commit -m "chore: ability migration diagnostics"
          git push origin HEAD:feature/standalone-ability-compendiums
          exit 1

      - name: Build compendium packs
        run: npm run build:packs

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          npm test 2>&1 | tee /tmp/ability-migration-tests.log
          exit ${PIPESTATUS[0]}

      - name: Save test diagnostics
        if: steps.tests.outcome == 'failure'
        run: cp /tmp/ability-migration-tests.log docs/ability-migration-tests-error.log

      - name: Commit test diagnostics
        if: steps.tests.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ability-migration-tests-error.log
          git commit -m "chore: ability migration test diagnostics"
          git push origin HEAD:feature/standalone-ability-compendiums
          exit 1

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs system.json docs/ability-name-variants.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: normalize standalone ability sources"
          git push origin HEAD:feature/standalone-ability-compendiums
