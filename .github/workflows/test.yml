name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep each revision independently runnable and never cancel diagnostics.
  # Including the commit SHA prevents a queued run from blocking the next
  # revision when a previous GitHub-hosted runner is unavailable.
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  unit:
    name: Unit and document tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit
      - name: Publish diagnostics
        if: always()
        run: |
          echo "## Unit and document tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: `npm run test:unit`" >> "$GITHUB_STEP_SUMMARY"
          echo "Failures are reported independently by Node's spec reporter." >> "$GITHUB_STEP_SUMMARY"

  behavior:
    name: BDD behavior tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run behavior tests
        run: npm run test:behavior
      - name: Publish diagnostics
        if: always()
        run: |
          echo "## BDD behavior tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: `npm run test:behavior`" >> "$GITHUB_STEP_SUMMARY"
          echo "Gameplay behavior failures are isolated from low-level rule tests." >> "$GITHUB_STEP_SUMMARY"

  content:
    name: Content contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Normalize CRD source metadata
        run: npm run migrate:packs
      - name: Run content tests
        run: npm run test:content
      - name: Publish diagnostics
        if: always()
        run: |
          echo "## Content contract tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: `npm run test:content`" >> "$GITHUB_STEP_SUMMARY"
          echo "Content failures are isolated from rule and application failures." >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration and architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Normalize CRD source metadata
        run: npm run migrate:packs
      - name: Run integration tests
        run: npm run test:integration
      - name: Run architecture audit
        if: always()
        run: npm run audit:architecture
      - name: Publish diagnostics
        if: always()
        run: |
          echo "## Integration diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commands: `npm run test:integration`, `npm run audit:architecture`" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build release package
        run: npm run package
      - name: Validate compiled compendium packs
        run: node --test --test-reporter=spec tests/build/compendium-packs.test.mjs
      - name: Detect generated changes
        id: generated
        run: |
          if [ -n "$(git status --porcelain -- . ':!dist')" ]; then
            echo "::error::The package build changed files outside dist/."
            git status --short -- . ':!dist'
            exit 1
          fi
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "dist_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "dist_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Update versioned release artifacts in PR
        if: steps.generated.outputs.dist_changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add dist/system.json dist/system.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update versioned release package"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Verify versioned release artifacts
        run: node scripts/verify-package.mjs
      - name: Verify generated files are committed
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ is not in sync with the package generated from this PR."
            git status --short -- dist
            exit 1
          fi
          git diff --exit-code -- dist/system.json
      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypher-system-package
          path: |
            dist/system.json
            dist/system.zip
          if-no-files-found: error
      - name: Publish diagnostics
        if: always()
        run: |
          echo "## System package" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: `npm run package`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f dist/system.json ] && [ -f dist/system.zip ]; then
            echo "Package artifacts were created and verified against the PR tree." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Package artifacts were not created." >> "$GITHUB_STEP_SUMMARY"
          fi

  repository:
    name: Repository and E2E syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check E2E JavaScript syntax
        run: npm run check:e2e-syntax
      - name: Audit public repository data
        run: npm run audit:public-data
      - name: Publish diagnostics
        if: always()
        run: |
          echo "## Repository diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commands: `npm run check:e2e-syntax`, `npm run audit:public-data`" >> "$GITHUB_STEP_SUMMARY"

  coverage:
    name: Rule coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run rule coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rule-coverage
          path: coverage/lcov.info
          if-no-files-found: warn
      - name: Publish diagnostics
        if: always()
        run: |
          echo "## Rule coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Command: `npm run test:coverage`" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage is currently reported as a quality metric; mutation testing provides the stronger test-effectiveness signal." >> "$GITHUB_STEP_SUMMARY"

  status:
    name: CI summary
    if: always()
    needs:
      - unit
      - behavior
      - content
      - integration
      - package
      - repository
      - coverage
    runs-on: ubuntu-latest
    steps:
      - name: Report overall result
        run: |
          echo "## CI result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit and document tests | ${{ needs.unit.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| BDD behavior tests | ${{ needs.behavior.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Content contracts | ${{ needs.content.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Integration and architecture | ${{ needs.integration.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| System package | ${{ needs.package.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository checks | ${{ needs.repository.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rule coverage | ${{ needs.coverage.result }} |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.unit.result }}" != "success" ] || \
             [ "${{ needs.behavior.result }}" != "success" ] || \
             [ "${{ needs.content.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ] || \
             [ "${{ needs.package.result }}" != "success" ] || \
             [ "${{ needs.repository.result }}" != "success" ] || \
             [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "One or more CI categories failed. Inspect the corresponding job above; this summary does not duplicate the failure." >> "$GITHUB_STEP_SUMMARY"
          fi
