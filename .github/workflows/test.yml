name: Unit Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check E2E JavaScript syntax
        run: |
          node --check scripts/run-foundry-e2e.mjs
          node --check playwright.config.mjs
          node --check tests/e2e/foundry-session.mjs
          node --check tests/e2e/foundry-runtime.spec.mjs
          node --check tests/e2e/foundry-gameplay.spec.mjs

      - name: Run unit tests
        run: npm test

      - name: Audit public repository data
        run: npm run audit:public-data