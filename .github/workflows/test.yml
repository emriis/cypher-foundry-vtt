name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and document tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit
      - name: Publish diagnostics
        if: always()
        run: |
          echo "## Unit and document tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Command: `npm run test:unit`' >> "$GITHUB_STEP_SUMMARY"
          echo "Failures are reported independently by Node's spec reporter." >> "$GITHUB_STEP_SUMMARY"

  behavior:
    name: BDD behavior tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run behavior tests
        run: npm run test:behavior
      - name: Publish diagnostics
        if: always()
        run: |
          echo "## BDD behavior tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Command: `npm run test:behavior`' >> "$GITHUB_STEP_SUMMARY"
          echo "Gameplay behavior failures are isolated from low-level rule tests." >> "$GITHUB_STEP_SUMMARY"

  content:
    name: Content contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Normalize CRD source metadata
        run: npm run migrate:packs
      - name: Run content tests
        run: npm run test:content
      - name: Publish diagnostics
        if: always()
        run: |
          echo "## Content contract tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Command: `npm run test:content`' >> "$GITHUB_STEP_SUMMARY"
          echo "Content failures are isolated from rule and application failures." >> "$GITHUB_STEP_SUMMARY"

  identities:
    name: Bilingual compendium identity inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit unmodified authored and normalized identities
        run: npm run audit:ids
      - name: Upload proposed EN/FR migration map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compendium-identity-audit
          path: reports/compendium-identity-audit.json
          if-no-files-found: warn
          retention-days: 7

  callouts:
    name: CRD callouts and source completeness inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check OOXML callout extraction with synthetic Word fixtures
        run: python3 -m unittest discover -s tests/python -p 'test_*.py'
      - name: Audit original CRD boxes and English normalized sources
        run: npm run audit:callouts -- --normalized
      - name: Upload PR4 CRD coverage inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crd-callout-coverage
          path: reports/crd-callout-coverage.json
          retention-days: 14
          if-no-files-found: error

  terminology:
    name: French normative glossary and inclusive-language review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit shared CRD terminology and French editorial proposals
        run: npm run audit:terminology
      - name: Upload terminology and inclusive-language findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: french-terminology-review
          path: reports/terminology-fr.json
          retention-days: 14
          if-no-files-found: error

  abilities-pr7:
    name: PR7 English/French Ability clauses and translation review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compare the first 175 normalized Ability source texts
        run: npm run audit:abilities-pr7
      - name: Archive full comparative review worksheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr7-abilities-comparative-review
          path: reports/ability-review-batch-1.json
          retention-days: 30
          if-no-files-found: error

  abilities-pr8:
    name: PR8 English/French Ability clauses and translation review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compare the next 175 normalized Ability source texts
        run: npm run audit:abilities-pr8 -- --print-pairs
      - name: Archive full comparative review worksheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr8-abilities-comparative-review
          path: reports/ability-review-batch-2.json
          retention-days: 30
          if-no-files-found: error

  integration:
    name: Integration and architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Normalize CRD source metadata
        run: npm run migrate:packs
      - name: Run integration tests
        run: npm run test:integration
      - name: Run architecture audit
        if: always()
        run: npm run audit:architecture
      - name: Publish diagnostics
        if: always()
        run: |
          echo "## Integration diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Commands: `npm run test:integration`, `npm run audit:architecture`' >> "$GITHUB_STEP_SUMMARY"


  repository:
    name: Repository and E2E syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check E2E JavaScript syntax
        run: npm run check:e2e-syntax
      - name: Check ESM runtime and tooling boundaries
        run: npm run lint
      - name: Check pure-rule JSDoc pilot
        run: npm run typecheck
      - name: Check system JavaScript syntax
        run: npm run check:system-syntax
      - name: Audit public repository data
        run: npm run audit:public-data
      - name: Publish diagnostics
        if: always()
        run: |
          echo "## Repository diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Commands: `npm run check:e2e-syntax`, `npm run audit:public-data`' >> "$GITHUB_STEP_SUMMARY"

  sources:
    name: Source normalization contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:sources

  coverage:
    name: Loaded runtime coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run rule coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-coverage
          path: coverage/lcov.info
          if-no-files-found: warn
      - name: Publish diagnostics
        if: always()
        run: |
          echo "## Loaded runtime coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo 'Command: `npm run test:coverage`' >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage is currently reported as a quality metric; mutation testing provides the stronger test-effectiveness signal." >> "$GITHUB_STEP_SUMMARY"

  status:
    name: CI summary
    if: always()
    needs:
      - unit
      - behavior
      - content
      - identities
      - callouts
      - terminology
      - abilities-pr7
      - abilities-pr8
      - integration
      - repository
      - coverage
      - sources
    runs-on: ubuntu-latest
    steps:
      - name: Report overall result
        run: |
          echo "## CI result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit and document tests | ${{ needs.unit.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| BDD behavior tests | ${{ needs.behavior.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Content contracts | ${{ needs.content.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Compendium identity audit | ${{ needs.identities.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CRD callout source audit | ${{ needs.callouts.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| French normative terminology | ${{ needs.terminology.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PR7 Ability comparative review | ${{ needs.abilities-pr7.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PR8 Ability comparative review | ${{ needs.abilities-pr8.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Integration and architecture | ${{ needs.integration.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source normalization | ${{ needs.sources.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository checks | ${{ needs.repository.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Loaded runtime coverage | ${{ needs.coverage.result }} |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.unit.result }}" != "success" ] || \
             [ "${{ needs.behavior.result }}" != "success" ] || \
             [ "${{ needs.content.result }}" != "success" ] || \
             [ "${{ needs.identities.result }}" != "success" ] || \
             [ "${{ needs.callouts.result }}" != "success" ] || \
             [ "${{ needs.terminology.result }}" != "success" ] || \
             [ "${{ needs.abilities-pr7.result }}" != "success" ] || \
             [ "${{ needs.abilities-pr8.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ] || \
             [ "${{ needs.repository.result }}" != "success" ] || \
             [ "${{ needs.sources.result }}" != "success" ] || \
             [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "One or more required CI categories failed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All required CI categories passed." >> "$GITHUB_STEP_SUMMARY"
