name: Unit Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check E2E JavaScript syntax
        run: |
          node --check scripts/run-foundry-e2e.mjs
          node --check playwright.config.mjs
          node --check tests/e2e/foundry-session.mjs
          node --check tests/e2e/foundry-runtime.spec.mjs
          node --check tests/e2e/foundry-gameplay.spec.mjs

      - name: Build compendium packs
        run: npm run build:packs

      - name: Run unit tests
        run: npm test

      - name: Publish test summary
        if: always()
        run: |
          echo "## Unit test diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The unit-test step uses Node's `spec` reporter so each failure includes the test name, assertion details, and stack trace directly in the Actions log." >> "$GITHUB_STEP_SUMMARY"

      - name: Audit public repository data
        run: npm run audit:public-data