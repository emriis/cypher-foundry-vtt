name: Unit Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check E2E JavaScript syntax
        run: |
          node --check scripts/run-foundry-e2e.mjs
          node --check playwright.config.mjs
          node --check tests/e2e/foundry-session.mjs
          node --check tests/e2e/foundry-runtime.spec.mjs
          node --check tests/e2e/foundry-gameplay.spec.mjs

      - name: Install dependencies
        run: npm ci

      - name: Normalize standalone abilities
        run: npm run migrate:abilities

      - name: Build compendium packs
        run: npm run build:packs

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: |
          npm test 2>&1 | tee /tmp/unit-tests.log
          exit ${PIPESTATUS[0]}

      - name: Save test log
        if: steps.tests.outcome == 'failure'
        run: cp /tmp/unit-tests.log docs/current-unit-test-failure.log

      - name: Commit test log
        if: steps.tests.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/current-unit-test-failure.log
          git commit -m "chore: capture current unit test diagnostics"
          git push origin HEAD:feature/standalone-ability-compendiums
          exit 1

      - name: Commit normalized sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs docs/ability-name-variants.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: normalize standalone ability sources"
          git push origin HEAD:feature/standalone-ability-compendiums