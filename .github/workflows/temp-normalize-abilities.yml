name: Temporary ability source normalization

on:
  push:
    branches:
      - feature/standalone-ability-compendiums

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message != 'chore: normalize standalone ability sources'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/standalone-ability-compendiums
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate:abilities
      - run: npm run build:packs
      - run: npm test
      - name: Commit normalized sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs docs/ability-name-variants.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: normalize standalone ability sources"
          git push origin HEAD:feature/standalone-ability-compendiums
