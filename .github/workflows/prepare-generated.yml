name: Prepare generated artifacts

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: prepare-generated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Build and validate generated artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build compiled compendium packs
        run: npm run build:packs

      - name: Validate compiled compendium packs
        run: node --test --test-reporter=spec tests/build/compendium-packs.test.mjs

      - name: Build release package
        run: npm run package

      - name: Reject unexpected generated changes
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- . ':!packs' ':!dist')" ]; then
            echo "::error::Generation changed files outside packs/ and dist/."
            git status --short -- . ':!packs' ':!dist'
            exit 1
          fi

      - name: Verify generated artifacts
        run: node scripts/verify-package.mjs

      - name: Fail if generated artifacts are stale
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- . ':!packs' ':!dist')" ]; then
            echo "::error::Generation changed files outside packs/ and dist/."
            git status --short -- . ':!packs' ':!dist'
            exit 1
          fi

          if [ -n "$(git status --porcelain -- packs dist)" ]; then
            echo "::error::Generated artifacts are stale. Run npm run build:packs and npm run package, then commit the resulting packs/ and dist/ changes."
            git status --short -- packs dist
            exit 1
          fi

          echo "Generated artifacts are synchronized with the checked-out branch."

      - name: Publish diagnostics
        if: always()
        run: |
          echo "## Generated artifact preparation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated files: packs/ and dist/." >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow validates generated artifacts without pushing commits or triggering another workflow run." >> "$GITHUB_STEP_SUMMARY"
