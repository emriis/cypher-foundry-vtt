name: Prepare generated artifacts

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: prepare-generated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-fork:
    name: Validate fork artifacts without writes
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:packs
      - run: npm run test:build
      - run: npm run package
      - run: node scripts/verify-package.mjs
      - name: Upload generated system
        uses: actions/upload-artifact@v4
        with:
          name: generated-system-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/system.json
            dist/system.zip
          if-no-files-found: error
          retention-days: 7

  prepare:
    name: Build and validate generated artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build compiled compendium packs
        run: npm run build:packs

      - name: Validate compiled compendium packs
        run: node --test --test-reporter=spec tests/build/compendium-packs.test.mjs

      - name: Build release package
        run: npm run package

      - name: Verify package reproducibility
        run: |
          set -euo pipefail
          cp dist/system.zip /tmp/system-first.zip
          npm run package
          cmp --silent /tmp/system-first.zip dist/system.zip || {
            echo "::error::The release package is not reproducible: two consecutive builds produced different dist/system.zip files."
            exit 1
          }
          echo "Two consecutive package builds produced identical ZIP bytes."

      - name: Verify generated artifacts
        run: node scripts/verify-package.mjs

      - name: Reject unexpected generated changes
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- . ':!packs' ':!dist')" ]; then
            echo "::error::Generation changed files outside packs/ and dist/."
            git status --short -- . ':!packs' ':!dist'
            exit 1
          fi

      # GITHUB_TOKEN commits trigger approval-required pull_request reruns.
      # Publish validated outputs without creating another revision of the PR.
      - name: Upload generated system
        uses: actions/upload-artifact@v4
        with:
          name: generated-system-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/system.json
            dist/system.zip
          if-no-files-found: error
          retention-days: 7

      - name: Publish diagnostics
        if: always()
        run: |
          echo "## Generated artifact preparation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Generated files: packs/ and dist/." >> "$GITHUB_STEP_SUMMARY"
          echo "Validated system.json and system.zip are available in this run's generated-system artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "PR branches are not modified, so generation does not trigger approval-required bot reruns." >> "$GITHUB_STEP_SUMMARY"
