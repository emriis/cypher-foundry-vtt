name: Build Compendium Packs

on:
  push:
    branches:
      - main
    paths:
      - "packs/**/_source/**"
      - "scripts/build-packs.mjs"
      - "scripts/migrate-ability-sources.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-packs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Foundry CLI
        run: npm install --no-save @foundryvtt/foundryvtt-cli@3.0.4

      - name: Normalize CRD source metadata
        run: npm run migrate:packs

      - name: Validate compendium sources
        run: node --test tests/content/*.test.mjs

      - name: Build LevelDB packs
        run: npm run build:packs

      - name: Commit generated packs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- packs; then
            echo "No generated pack changes."
            exit 0
          fi
          git add packs
          git commit -m "Build compendium packs [skip ci]"
          git push
