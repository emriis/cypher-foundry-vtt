name: Build Compendium Packs

on:
  push:
    branches:
      - main
    paths:
      - "packs/**/_source/**"
      - "scripts/build-packs.mjs"
      - "scripts/pack-publication.mjs"
      - "scripts/migrate-ability-sources.mjs"
      - "scripts/source-migration/**"
      - "scripts/crd-audit/**"
      - "scripts/localization/**"
      - "scripts/review-translations.mjs"
      - "scripts/validation-workspace.mjs"
      - "module/crd/**"
      - "translations/fr/**"
      - "system.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-packs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      # Compilation normalizes privately: the generation job never rewrites
      # canonical authoring records, nor the legacy FR source shells.
      - name: Build LevelDB packs
        run: npm run build:packs

      - name: Verify compiled packs
        run: npm run test:build

      - name: Commit generated packs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- packs; then
            echo "No generated pack changes."
            exit 0
          fi
          git add packs
          git commit -m "Build compendium packs [skip ci]"
          git push
